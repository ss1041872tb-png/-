scene.add(new THREE.HemisphereLight('#f4fbff','#667782',2.1));const sun=new THREE.DirectionalLight('#fff2d5',3);sun.position.set(-18,36,18);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-55;sun.shadow.camera.right=55;sun.shadow.camera.top=55;sun.shadow.camera.bottom=-55;scene.add(sun);
const mats={ground:mat('#90a789'),road:mat('#4a5967'),line:mat('#ffedb8'),walk:mat('#d9c6a4'),wood:mat('#815b5a'),white:mat('#ffffff')};function mat(c,emissive){return new THREE.MeshStandardMaterial({color:c,roughness:.83,emissive:emissive||'#000000'})}function cube(w,h,d,m,x,y,z,group=scene){const ob=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);ob.position.set(x,y,z);ob.castShadow=true;ob.receiveShadow=true;group.add(ob);return ob}function sphere(r,m,x,y,z,group=scene){const o=new THREE.Mesh(new THREE.SphereGeometry(r,10,8),m);o.position.set(x,y,z);o.castShadow=true;group.add(o);return o}
cube(75,.45,67,mats.ground,0,-.3,0);cube(75,.07,9,mats.road,0,.02,0);cube(10,.07,67,mats.road,0,.025,0);for(let i=-31;i<34;i+=7){cube(3,.09,.15,mats.line,i,.09,0);cube(.15,.09,3,mats.line,0,.09,i)}

function labelTexture(text,color='#fff4ce'){const cn=document.createElement('canvas');cn.width=1024;cn.height=220;const ctx=cn.getContext('2d');ctx.fillStyle='#22324c';ctx.fillRect(0,0,1024,220);ctx.strokeStyle='#ebd9a7';ctx.lineWidth=12;ctx.strokeRect(8,8,1008,204);ctx.fillStyle=color;ctx.font='bold 77px "Noto Sans TC", sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';let size=76;while(ctx.measureText(text).width>940&&size>35){size-=3;ctx.font=`bold ${size}px "Noto Sans TC",sans-serif`}ctx.fillText(text,512,112);const t=new THREE.CanvasTexture(cn);t.colorSpace=THREE.SRGBColorSpace;return t}
function makeShop(item,i){const side=i<5?-1:1;const row=i%5;const x=(row-2)*13.2;const z=side*13.5;const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);const front=side===-1?1:-1;const base=mat(colors[i]);cube(10.4,6.8,7.7,base,0,3.45,0,g);cube(11,.5,8.4,mat('#eff0e6'),0,7,0,g);cube(11.2,.25,2.8,mat(i%2?'#e77759':'#f1d58f'),0,4.6,front*4.8,g);for(let v of [-3.3,0,3.3]){cube(2.45,2.85,.12,mat('#426e7b'),v,2.5,front*3.91,g);cube(2.25,.15,.18,mat('#faf2d8'),v,3.7,front*4,g)}const sign=cube(9.65,1.75,.3,mat('#23304a','#141f35'),0,5.6,front*4.02,g);const sm=new THREE.MeshBasicMaterial({map:labelTexture(item.name),side:THREE.DoubleSide});const plane=new THREE.Mesh(new THREE.PlaneGeometry(9.45,1.55),sm);plane.position.set(0,5.6,front*4.25);plane.rotation.y=front===1?0:Math.PI;g.add(plane);plane.userData.shop=item;sign.userData.shop=item;signs.push(plane,sign);for(let j=0;j<3;j++){cube(1.15,1.2,.1,mat('#d4e8e6'),-3.1+j*3.1,5.65,-front*3.91,g)}const roof=cube(9.2,.42,7.3,mat('#465163'),0,7.48,0,g);buildings.push({g,plane});const foot=mat('#e4d2b7');cube(11,.12,2.6,foot,0,.13,front*5.28,g);}

const raycaster=new THREE.Raycaster(),mouse=new THREE.Vector2(),keys=new Set(),visited=new Set();let angle=.45,pitch=.65,distance=42,drag=false,moved=false,lastX=0,lastY=0;const drawer=document.getElementById('drawer');function showShop(item){visited.add(item.id);document.getElementById('count').textContent=visited.size;document.getElementById('name').textContent=item.name;document.getElementById('category').textContent=item.category;document.getElementById('description').textContent=item.description;document.getElementById('address').textContent=item.address;document.getElementById('emoji').textContent=item.emoji;document.getElementById('tags').innerHTML='';for(let t of item.tags){let e=document.createElement('span');e.className='tag';e.textContent=t;document.getElementById('tags').append(e)}document.getElementById('navigation').href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(item.name+' '+item.address);drawer.classList.add('open');if(visited.size===10)toast('🏆 恭喜！完成中和十大美食探索！')}document.getElementById('close').onclick=()=>drawer.classList.remove('open');function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.opacity='1';clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.style.opacity='0',2300)}
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;moved=false;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;if(Math.abs(dx)+Math.abs(dy)>3)moved=true;angle-=dx*.005;pitch=Math.max(.25,Math.min(1.35,pitch+dy*.004));lastX=e.clientX;lastY=e.clientY});renderer.domElement.addEventListener('pointerup',e=>{drag=false;if(moved)return;mouse.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObjects(signs,false);if(hits.length){showShop(hits[0].object.userData.shop)}});renderer.domElement.addEventListener('wheel',e=>{distance=Math.max(17,Math.min(70,distance+e.deltaY*.025))},{passive:true});window.addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault();if(e.key==='Escape')drawer.classList.remove('open')});window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));document.querySelectorAll('#mobile button').forEach(b=>{const key=b.dataset.key;const on=e=>{e.preventDefault();keys.add(key)},off=e=>{e.preventDefault();keys.delete(key)};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)});
const clock=new THREE.Clock(),look=new THREE.Vector3();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;let vx=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0),vz=(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0);if(vx||vz){const n=Math.hypot(vx,vz);vx/=n;vz/=n;player.position.x=THREE.MathUtils.clamp(player.position.x+vx*dt*7,-34,34);player.position.z=THREE.MathUtils.clamp(player.position.z+vz*dt*7,-32,32);player.rotation.y=Math.atan2(vx,vz);player.children[0].position.y=1.45+Math.sin(t*13)*.04}for(const npc of npcs){npc.o.position.x+=npc.s*npc.d*dt*2;if(Math.abs(npc.o.position.x)>34)npc.d*=-1;npc.o.position.z=npc.z+Math.sin(t*.7+npc.phase)*.48;npc.o.rotation.y=npc.d>0?Math.PI/2:-Math.PI/2}const target=player.position;look.set(target.x,0,target.z);const pos=new THREE.Vector3(target.x+Math.sin(angle)*Math.cos(pitch)*distance,Math.sin(pitch)*distance,target.z+Math.cos(angle)*Math.cos(pitch)*distance);camera.position.lerp(pos,.065);camera.lookAt(look);for(let b of buildings)b.plane.material.color.set(visited.has(b.plane.userData.shop.id)?'#d0ffdc':'#ffffff');renderer.render(scene,camera)}animate();window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
